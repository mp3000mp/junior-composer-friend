# The front is built HERE, right before the rsync, so the bundle shipped is always the one of the
# working copy — never a stale dist/.
- name: Build the frontend locally
  command:
    cmd: ./local_build.sh
    chdir: "{{ playbook_dir }}"
  delegate_to: localhost
  become: false
  changed_when: true

- name: Create frontend directories
  become_user: "{{ maintainer_user }}"
  file:
    path: "{{ app_directory }}/frontend/{{ item }}"
    state: directory
    owner: "{{ maintainer_user }}"
    group: "{{ maintainer_user }}"
    mode: '755'
  loop:
    - 'dist'
    - 'log'

- name: Deploy frontend dist
  become_user: "{{ maintainer_user }}"
  synchronize:
    delete: true
    src: '{{ playbook_dir }}/../../{{ item }}'
    dest: "{{ app_directory }}/frontend/"
    recursive: true
    rsync_opts:
      - "--chown={{ maintainer_user }}:{{ maintainer_user }}"
      - '--chmod=0755'
  loop:
    - 'dist'
