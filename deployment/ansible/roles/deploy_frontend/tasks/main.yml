- name: Check dist directory exists
  stat:
    path: '{{ playbook_dir }}/../../dist'
  register: dist_stat
  delegate_to: localhost

- name: Fail if dist directory does not exist
  fail:
    msg: "dist/ directory not found. Run local_build.sh first."
  when: not dist_stat.stat.exists

- name: Create frontend directories
  become_user: "{{ maintainer_user }}"
  file:
    path: "{{ app_directory }}/frontend/{{ item }}"
    state: directory
    owner: "{{ maintainer_user }}"
    group: "{{ maintainer_user }}"
    mode: '755'
  loop:
    - 'dist'
    - 'log'

- name: Deploy frontend dist
  become_user: "{{ maintainer_user }}"
  synchronize:
    delete: true
    src: '{{ playbook_dir }}/../../{{ item }}'
    dest: "{{ app_directory }}/frontend/"
    recursive: true
    rsync_opts:
      - "--chown={{ maintainer_user }}:{{ maintainer_user }}"
      - '--chmod=0755'
  loop:
    - 'dist'
