- name: Enable required Apache modules
  command:
    cmd: a2enmod {{ item }}
    creates: "/etc/apache2/mods-enabled/{{ item }}.load"
  loop:
    - ssl
    - rewrite
  notify: reload apache2

- name: Create vhosts frontend
  template:
    src: "templates/vhost_frontend.conf.j2"
    dest: "/etc/apache2/sites-available/{{ frontend_server_name }}.conf"
    owner: root
    group: root
    mode: '0644'
  notify: reload apache2

- name: Enable site
  command:
    cmd: a2ensite {{ item }}
    creates: "/etc/apache2/sites-enabled/{{ item }}.conf"
  loop:
    - "{{ frontend_server_name }}"
  notify: reload apache2

# Certbot needs the http vhost to be live to answer the challenge
- name: Apply apache changes before certbot
  meta: flush_handlers

# certonly: certbot must not write its own ssl vhost, ours comes from the template below
- name: Certbot
  command:
    creates: "/etc/letsencrypt/live/{{ item }}"
    cmd: "certbot certonly --apache --agree-tos --non-interactive -d {{ item }} -m {{ admin_email }}"
  loop:
    - "{{ frontend_server_name }}"

- name: Configure Certbot auto-renewal cron
  cron:
    name: "certbot renew"
    job: "certbot renew --quiet"
    minute: "0"
    hour: "3"
    weekday: "1"
    user: root

# certonly installs nothing in apache: reload it after any renewal (cron above or distro timer)
- name: Reload apache after Certbot renewal
  copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-apache.sh
    content: |
      #!/bin/sh
      systemctl reload apache2
    owner: root
    group: root
    mode: "0755"

- name: Ensure correct ownership of Certbot directories
  file:
    path: "{{ item }}"
    owner: root
    group: www-data
    state: directory
    mode: "0750"
  loop:
    - "/etc/letsencrypt/archive/{{ frontend_server_name }}"
    - "/etc/letsencrypt/live/{{ frontend_server_name }}"

- name: Ensure correct permissions on Certbot certificate
  file:
    path: "/etc/letsencrypt/live/{{ frontend_server_name }}/fullchain.pem"
    owner: root
    group: www-data
    mode: "0640"

# Apache reads the private key as root before dropping privileges
- name: Ensure correct permissions on Certbot private key
  file:
    path: "/etc/letsencrypt/live/{{ frontend_server_name }}/privkey.pem"
    owner: root
    group: root
    mode: "0600"

- name: Create vhosts ssl
  template:
    src: "templates/vhost_frontend-le-ssl.conf.j2"
    dest: "/etc/apache2/sites-available/{{ frontend_server_name }}-le-ssl.conf"
    owner: root
    group: root
    mode: '0644'
  notify: reload apache2

- name: Enable ssl site
  command:
    cmd: a2ensite {{ item }}
    creates: "/etc/apache2/sites-enabled/{{ item }}.conf"
  loop:
    - "{{ frontend_server_name }}-le-ssl"
  notify: reload apache2
