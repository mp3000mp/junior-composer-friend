- name: Create vhosts frontend
  become: true
  become_user: root
  template:
    src: "templates/vhost_frontend.conf.j2"
    dest: "/etc/apache2/sites-available/{{ frontend_server_name }}.conf"
    owner: "{{ maintainer_user }}"
    group: "{{ maintainer_user }}"
    mode: '0640'

- name: Create vhosts ssl
  become: true
  become_user: root
  template:
    src: "templates/vhost_frontend-le-ssl.conf.j2"
    dest: "/etc/apache2/sites-available/{{ frontend_server_name }}-le-ssl.conf"
    owner: "{{ maintainer_user }}"
    group: "{{ maintainer_user }}"
    mode: '0640'

- name: Enable site
  become: true
  become_user: root
  command: a2ensite {{ item }}
  loop:
    - "{{ frontend_server_name }}"

- name: Certbot
  become: true
  become_user: root
  shell:
    creates: "/etc/letsencrypt/live/{{ item }}"
    cmd: "certbot --apache --agree-tos --non-interactive -d {{ item }} -m {{ admin_email }}"
  notify: restart apache2
  loop:
    - "{{ frontend_server_name }}"
