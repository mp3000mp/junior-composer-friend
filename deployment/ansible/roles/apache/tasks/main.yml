- name: Enable required Apache modules
  command:
    cmd: a2enmod {{ item }}
    creates: "/etc/apache2/mods-enabled/{{ item }}.load"
  loop:
    - ssl
    - rewrite
  notify: restart apache2

- name: Create vhosts frontend
  template:
    src: "templates/vhost_frontend.conf.j2"
    dest: "/etc/apache2/sites-available/{{ frontend_server_name }}.conf"
    owner: root
    group: root
    mode: '0644'
  notify: restart apache2

- name: Create vhosts ssl
  template:
    src: "templates/vhost_frontend-le-ssl.conf.j2"
    dest: "/etc/apache2/sites-available/{{ frontend_server_name }}-le-ssl.conf"
    owner: root
    group: root
    mode: '0644'
  notify: restart apache2

- name: Enable site
  command:
    cmd: a2ensite {{ item }}
    creates: "/etc/apache2/sites-enabled/{{ item }}.conf"
  loop:
    - "{{ frontend_server_name }}"
  notify: restart apache2

- name: Certbot
  shell:
    creates: "/etc/letsencrypt/live/{{ item }}"
    cmd: "certbot --apache --agree-tos --non-interactive -d {{ item }} -m {{ admin_email }}"
  notify: restart apache2
  loop:
    - "{{ frontend_server_name }}"

- name: Configure Certbot auto-renewal cron
  cron:
    name: "certbot renew"
    job: "certbot renew --quiet"
    minute: "0"
    hour: "3"
    weekday: "1"
    user: root

- name: Ensure correct ownership of Certbot directories
  file:
    path: "{{ item }}"
    owner: root
    group: www-data
    state: directory
    mode: "0750"
  loop:
    - "/etc/letsencrypt/archive/{{ frontend_server_name }}"
    - "/etc/letsencrypt/live/{{ frontend_server_name }}"

- name: Ensure correct permissions on Certbot certificates
  file:
    path: "{{ item }}"
    owner: root
    group: www-data
    mode: "0640"
  loop:
    - "/etc/letsencrypt/live/{{ frontend_server_name }}/fullchain.pem"
    - "/etc/letsencrypt/live/{{ frontend_server_name }}/privkey.pem"
